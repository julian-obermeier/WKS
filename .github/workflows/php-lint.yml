name: PHP Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint PHP files
        run: find app bootstrap config database public routes resources bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Static quality checks
        run: |
          php tests/static_quality.php
          php tests/security_architecture.php
      - name: Check JavaScript syntax
        run: node --check public/assets/app.js
      - name: Validate JSON artifacts
        run: |
          php -r 'json_decode(file_get_contents("CHANGELOG.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("public/manifest.webmanifest"), true, 512, JSON_THROW_ON_ERROR);'


  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wks_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_BASE_PATH: ""
      APP_TIMEZONE: Europe/Berlin
      APP_KEY: integration-test-key
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: wks_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4
      SESSION_NAME: WKS_TEST
      SESSION_SECURE: "false"
      SESSION_SAMESITE: Lax
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo, zip, curl
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && exit 0
            sleep 2
          done
          exit 1
      - name: Run database acceptance suite
        run: php tests/integration_acceptance.php
      - name: Run authenticated HTTP smoke tests
        run: |
          APP_URL=http://127.0.0.1:8098 php -S 127.0.0.1:8098 -t public public/index.php >/tmp/wks-http-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          php tests/http_smoke.php
      - name: Run performance guardrails
        run: php tests/performance_acceptance.php
      - name: Run real multipart upload security test
        run: |
          php -r 'file_put_contents("/tmp/wks-valid.png", base64_decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2t0YAAAAASUVORK5CYII="));'
          printf '%s\n' '<?php echo "not an image"; ?>' > /tmp/wks-invalid.png
          php -S 127.0.0.1:8099 tests/http_upload_router.php >/tmp/wks-upload-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          VALID_CODE=$(curl -sS -o /tmp/wks-valid-response.json -w "%{http_code}" -F "file=@/tmp/wks-valid.png;type=image/png" http://127.0.0.1:8099/upload)
          test "$VALID_CODE" = "200" || { cat /tmp/wks-upload-server.log; cat /tmp/wks-valid-response.json; exit 1; }
          INVALID_CODE=$(curl -sS -o /tmp/wks-invalid-response.json -w "%{http_code}" -F "file=@/tmp/wks-invalid.png;type=image/png" http://127.0.0.1:8099/upload)
          test "$INVALID_CODE" = "422" || { cat /tmp/wks-upload-server.log; cat /tmp/wks-invalid-response.json; exit 1; }
